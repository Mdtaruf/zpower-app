<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Power | Real Estate & Construction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .hero-bg {
            background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), 
                              url('https://images.unsplash.com/photo-1541888946425-d81bb19240f5?q=80&w=1920&q=80');
            background-attachment: fixed; background-size: cover;
        }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="fixed w-full z-50 glass border-b border-slate-200">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-orange-600 text-white p-2 rounded-lg"><i data-lucide="zap" class="w-6 h-6"></i></div>
                <span class="text-2xl font-extrabold italic">Z POWER</span>
            </div>
            <div class="hidden md:flex space-x-8 font-semibold text-slate-600">
                <a href="#home" class="hover:text-orange-600">Home</a>
                <a href="#services" class="hover:text-orange-600">Services</a>
                <a href="#contact" class="hover:text-orange-600">Contact</a>
            </div>
            <a href="tel:+919999999999" class="bg-slate-900 text-white px-6 py-2 rounded-full font-bold flex items-center gap-2">
                <i data-lucide="phone" class="w-4 h-4"></i> Call
            </a>
        </div>
    </nav>

    <section id="home" class="hero-bg h-screen flex items-center justify-center text-white">
        <div class="text-center px-6">
            <h1 class="text-6xl md:text-8xl font-black mb-6">Z POWER</h1>
            <p class="text-xl text-slate-300 mb-10">Real Estate & Construction Excellence</p>
            <a href="#contact" class="bg-orange-600 px-8 py-4 rounded-xl font-bold text-lg shadow-xl">Start Project</a>
        </div>
    </section>

    <section id="services" class="py-24 container mx-auto px-6">
        <h2 class="text-4xl font-extrabold text-center mb-16">Our Services</h2>
        <div class="grid lg:grid-cols-2 gap-8">
            <div th:each="service : ${services}" class="bg-white rounded-3xl p-8 border hover:shadow-xl transition">
                <i th:attr="data-lucide=${service.icon}" class="w-12 h-12 text-orange-600 mb-6"></i>
                <h3 class="text-2xl font-bold mb-4" th:text="${service.title}">Title</h3>
                <p class="text-slate-600 mb-6" th:text="${service.description}">Desc</p>
                <span class="text-orange-600 font-mono" th:text="${service.tag}">#Tag</span>
            </div>
        </div>
    </section>

    <section id="contact" class="py-24 bg-slate-900 text-white">
        <div class="container mx-auto px-6 max-w-4xl">
            <h2 class="text-4xl font-extrabold text-center mb-12">Contact Us</h2>
            
            <div th:if="${param.success}" class="bg-green-500 p-4 rounded-lg mb-8 text-center font-bold">
                Message Sent Successfully! Hum aapse jald hi sampark karenge.
            </div>

            <form th:action="@{/contact}" th:object="${contactLead}" method="post" class="grid grid-cols-1 gap-6">
                <input type="text" th:field="*{name}" placeholder="Your Name" required class="p-4 rounded-xl bg-slate-800 border border-slate-700 focus:border-orange-500 outline-none">
                <input type="email" th:field="*{email}" placeholder="Email Address" required class="p-4 rounded-xl bg-slate-800 border border-slate-700 focus:border-orange-500 outline-none">
                <textarea th:field="*{message}" rows="5" placeholder="Tell us about your project" required class="p-4 rounded-xl bg-slate-800 border border-slate-700 focus:border-orange-500 outline-none"></textarea>
                <button type="submit" class="bg-orange-600 hover:bg-orange-700 py-4 rounded-xl font-bold text-lg transition">Submit Inquiry</button>
            </form>
        </div>
    </section>

    <footer class="bg-white py-12 border-t">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center">
            <p class="font-bold italic">Z POWER CONSTRUCTION</p>
            <div class="flex gap-8 mt-4 md:mt-0">
                <a href="mailto:info@zpower.com"><i data-lucide="mail" class="hover:text-orange-600"></i></a>
                <a href="https://linkedin.com" target="_blank"><i data-lucide="linkedin" class="hover:text-orange-600"></i></a>
                <a href="https://instagram.com" target="_blank"><i data-lucide="instagram" class="hover:text-orange-600"></i></a>
            </div>
        </div>
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
