# Render/Live Configuration
# Hum variables use karenge taaki Render dashboard se values uthayi ja sakein
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Hibernate settings (Dialect add karna zaroori hai error hatane ke liye)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Driver class (optional but recommended)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver